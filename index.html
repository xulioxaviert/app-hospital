<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AETHERIA | Bespoke Wellness & Medical Atelier</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/hero.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FAF9F6;
        color: #2A2A2A;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2C3E30", // Deep Forest Green
              accent: "#C5B499", // Muted Gold/Beige
              "neutral-light": "#FAF9F6", // Alabaster
              "neutral-muted": "#E5E1DA", // Natural Stone
              charcoal: "#2A2A2A",
            },
            fontFamily: {
              display: ["Playfair Display", "serif"],
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="selection:bg-accent/30">
    <!-- Header Component -->
    <include src="./components/Header.html"></include>

    <!-- Hero Section -->
    <include src="./components/Hero.html"></include>

    <main>
      <!-- Services Section -->
      <include src="./components/Services.html"></include>

      <!-- Concierge Section -->
      <include src="./components/Concierge.html"></include>

      <!-- Practitioners Section -->
      <include src="./components/Practitioners.html"></include>

      <!-- Location Section -->
      <include src="./components/Location.html"></include>
    </main>

    <!-- Footer Component -->
    <include src="./components/Footer.html"></include>

    <script src="./loadComponents.js"></script>
  </body>
</html>
