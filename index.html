<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AETHERIA | Bespoke Wellness &amp; Medical Atelier</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2C3E30", // Deep Forest Green
              accent: "#C5B499", // Muted Gold/Beige
              "neutral-light": "#FAF9F6", // Alabaster
              "neutral-muted": "#E5E1DA", // Natural Stone
              charcoal: "#2A2A2A",
            },
            fontFamily: {
              display: ["Playfair Display", "serif"],
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply font-sans bg-neutral-light text-charcoal antialiased;
        }
        h1,
        h2,
        h3,
        .font-serif {
          @apply font-display;
        }
      }
    </style>
  </head>
  <body class="selection:bg-accent/30">
    <div data-include="components/header.html"></div>
    <main>
      <div data-include="components/hero.html"></div>
      <div data-include="components/services.html"></div>
      <div data-include="components/concierge.html"></div>
      <div data-include="components/practitioners.html"></div>
      <div data-include="components/location.html"></div>
    </main>
    <div data-include="components/footer.html"></div>
    <script>
            // Interacción para Preferred Window y submit del formulario Concierge
            document.addEventListener('DOMContentLoaded', function () {
              document.addEventListener('click', function (e) {
                if (e.target.classList && e.target.classList.contains('preferred-window-btn')) {
                  e.preventDefault();
                  // Quitar estilos activos de todos
                  document.querySelectorAll('.preferred-window-btn').forEach(btn => {
                    btn.classList.remove('border-accent', 'bg-accent/5', 'text-primary', 'hover:bg-accent', 'hover:text-white');
                    btn.classList.add('border-neutral-muted', 'text-charcoal/50');
                  });
                  // Activar el seleccionado
                  e.target.classList.add('border-accent', 'bg-accent/5', 'text-primary');
                  e.target.classList.remove('border-neutral-muted', 'text-charcoal/50');
                  // Guardar valor
                  const input = document.getElementById('preferred-window-input');
                  if (input) input.value = e.target.dataset.value;
                }
              });
              // Submit del formulario
              document.addEventListener('submit', function (e) {
                const form = e.target;
                if (form && form.querySelector('#datepicker')) {
                  e.preventDefault();
                  const data = Object.fromEntries(new FormData(form).entries());
                  console.log('Formulario enviado:', data);
                  // Aquí puedes hacer el fetch/POST real al backend si lo deseas
                }
              });
            });
      // Tiny client-side component loader: fetch HTML fragments and inject
      document.addEventListener('DOMContentLoaded', function () {
        const includes = document.querySelectorAll('[data-include]');
        let loaded = 0;
        includes.forEach(function (el) {
          var path = el.getAttribute('data-include');
          fetch(path)
            .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
            .then(function (html) { el.innerHTML = html; })
            .catch(function () { /* fail silently */ })
            .finally(function () {
              loaded++;
              // Cuando se cargue el componente de concierge, inicializa el datepicker
              if (path.includes('concierge') && el.querySelector('#datepicker')) {
                initDatePicker();
              }
            });
        });
      });

      // Date picker logic (ahora global)
      function initDatePicker() {
        const monthNames = [
          'January', 'February', 'March', 'April', 'May', 'June',
          'July', 'August', 'September', 'October', 'November', 'December'
        ];
        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();
        let selectedDate = null;
        const datepicker = document.querySelector('#datepicker');
        if (!datepicker) return;
        const monthEl = datepicker.querySelector('#datepicker-month');
        const daysEl = datepicker.querySelector('#datepicker-days');
        const inputEl = datepicker.querySelector('#selected-date');
        function renderCalendar(month, year) {
          monthEl.textContent = `${monthNames[month]} ${year}`;
          daysEl.innerHTML = '';
          let firstDay = new Date(year, month, 1);
          let startDay = (firstDay.getDay() + 6) % 7; // Monday as first day
          let daysInMonth = new Date(year, month + 1, 0).getDate();
          for (let i = 0; i < startDay; i++) {
            daysEl.innerHTML += `<span class='py-2 text-neutral-muted text-sm font-light'></span>`;
          }
          for (let d = 1; d <= daysInMonth; d++) {
            let dateObj = new Date(year, month, d);
            let isToday = dateObj.toDateString() === today.toDateString();
            let isSelected = selectedDate && dateObj.toDateString() === selectedDate.toDateString();
            let classes = 'py-2 rounded-sm cursor-pointer text-sm font-light transition-all';
            if (isSelected) classes += ' bg-primary text-neutral-light font-semibold shadow-lg shadow-primary/20';
            else if (isToday) classes += ' border border-accent';
            else classes += ' hover:bg-accent/10';
            daysEl.innerHTML += `<span tabindex="0" role="button" aria-label="${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}" class="${classes}" data-date="${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}">${d}</span>`;
          }
        }
        function onDayClick(e) {
          if (e.target && e.target.dataset.date) {
            selectedDate = new Date(e.target.dataset.date);
            inputEl.value = e.target.dataset.date;
            renderCalendar(currentMonth, currentYear);
          }
        }
        daysEl.addEventListener('click', onDayClick);
        daysEl.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && e.target.dataset.date) {
            selectedDate = new Date(e.target.dataset.date);
            inputEl.value = e.target.dataset.date;
            renderCalendar(currentMonth, currentYear);
          }
        });
        datepicker.querySelector('#prev-month').onclick = function() {
          currentMonth--;
          if (currentMonth < 0) { currentMonth = 11; currentYear--; }
          renderCalendar(currentMonth, currentYear);
        };
        datepicker.querySelector('#next-month').onclick = function() {
          currentMonth++;
          if (currentMonth > 11) { currentMonth = 0; currentYear++; }
          renderCalendar(currentMonth, currentYear);
        };
        renderCalendar(currentMonth, currentYear);
      }
    </script>
  </body>
</html>
